<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CalendarHub | Calendario, eventi e attività</title>

    <meta
      name="description"
      content="CalendarHub è un calendario digitale per organizzare eventi, appuntamenti, attività e liste To-do attraverso viste mensili, settimanali e giornaliere."
    />
    <meta name="application-name" content="CalendarHub" />
    <meta name="author" content="Manuel Cappai" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#111111" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:site_name" content="CalendarHub" />
    <meta
      property="og:title"
      content="CalendarHub | Calendario, eventi e attività"
    />
    <meta
      property="og:description"
      content="Organizza eventi, appuntamenti e liste To-do con viste mensili, settimanali e giornaliere, eventi ricorrenti e notifiche."
    />
    <meta
      property="og:url"
      content="https://manuelcappai94.github.io/CalendarHub/"
    />
    <meta
      property="og:image"
      content="https://manuelcappai94.github.io/CalendarHub/images/calendarhub-og.png"
    />
    <meta
      property="og:image:alt"
      content="Anteprima dell'applicazione CalendarHub"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="CalendarHub | Calendario, eventi e attività"
    />
    <meta
      name="twitter:description"
      content="Organizza eventi, appuntamenti e liste To-do con viste mensili, settimanali e giornaliere."
    />
    <meta
      name="twitter:image"
      content="https://manuelcappai94.github.io/CalendarHub/images/calendarhub-og.png"
    />

    <meta
      name="twitter:image:alt"
      content="Anteprima dell'applicazione CalendarHub"
    />
    <link rel="icon" type="image/ico" href="./images/favicon.ico" />
    <link
      rel="canonical"
      href="https://manuelcappai94.github.io/CalendarHub/"
    />

    <link rel="stylesheet" href="./src/style/global.css" />
    <link rel="stylesheet" href="./src/style/navbar.css" />
    <link rel="stylesheet" href="./src/style/month.css" />
    <link rel="stylesheet" href="./src/style/week.css" />
    <link rel="stylesheet" href="./src/style/daily.css" />
    <link rel="stylesheet" href="./src/style/to-do.css" />
    <link rel="stylesheet" href="./src/style/modalEvent.css" />
    <link rel="stylesheet" href="./src/style/mini-calendar.css" />
    <link rel="stylesheet" href="./src/style/tutorial.css" />
    <link rel="stylesheet" href="./src/style/renderEvents.css" />
    <link rel="stylesheet" href="./src/style/optionsBanner.css" />
    <link rel="stylesheet" href="./src/style/modalRepeat.css" />
    <link rel="stylesheet" href="./src/style/theme.css" />
    <link rel="stylesheet" href="./src/style/loader.css" />
  </head>
  <body>
    <div class="loader-layer" data-testid="loader">
      <div class="loader-box">
        <p class="loader-text">CARICAMENTO IN CORSO</p>
        <span class="loader-spinner" aria-hidden="true">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="50"
            height="50"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-loader-icon lucide-loader"
          >
            <path class="active-line" d="M12 2v4" />
            <path d="m16.2 7.8 2.9-2.9" />
            <path d="M18 12h4" />
            <path d="m16.2 16.2 2.9 2.9" />
            <path d="M12 18v4" />
            <path d="m4.9 19.1 2.9-2.9" />
            <path d="M2 12h4" />
            <path d="m4.9 4.9 2.9 2.9" />
          </svg>
        </span>
      </div>
    </div>
    <div id="prev-layer" aria-hidden="true"></div>
    <div id="next-layer" aria-hidden="true"></div>

    <nav id="navbar" aria-label="Navigazione calendario">
      <div id="first-layer">
        <!-- replace_viewModeSwitcher -->
      </div>

      <div id="layer">
        <div class="action-btns">
          <!-- replace_todayButton -->

          <!-- replace_todoListButton -->

          <!-- replace_tutorialButton -->
          <button
            type="button"
            class="notifications-permission-btn"
            aria-label="Attiva notifiche"
            aria-pressed="false"
          >
            <svg
              data-notification-icon="off"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-bell-off-icon lucide-bell-off"
            >
              <path d="M10.268 21a2 2 0 0 0 3.464 0" />
              <path
                d="M17 17H4a1 1 0 0 1-.74-1.673C4.59 13.956 6 12.499 6 8a6 6 0 0 1 .258-1.742"
              />
              <path d="m2 2 20 20" />
              <path
                d="M8.668 3.01A6 6 0 0 1 18 8c0 2.687.77 4.653 1.707 6.05"
              />
            </svg>

            <svg
              data-notification-icon="on"
              aria-hidden="true"
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-bell-ring-icon lucide-bell-ring"
            >
              <path d="M10.268 21a2 2 0 0 0 3.464 0" />

              <path
                d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"
              />
            </svg>
          </button>
        </div>
      </div>
    </nav>

    <main id="calendar-main">
      <h1 class="visually-hidden">CalendarHub</h1>
      <section id="month-carousel" aria-label="Vista mensile del calendario">
        <!-- replace_monthGrid -->
      </section>

      <section
        class="week-carousel"
        aria-label="Vista settimanale del calendario"
      >
        <!-- replace_weekGrid -->
      </section>

      <section id="day-corousel" aria-label="Vista giornaliera del calendario">
        <!-- replace_dayGrid -->
      </section>
    </main>

    <!-- /////////////////////to do list//////////////////////////////////// -->

    <!-- replace_todoPanel -->

    <div
      class="mini-calendar-layer"
      aria-hidden="true"
      data-testid="mini-calendar-layer"
    ></div>
    <section
      id="mini-calendar"
      class="day-select"
      role="dialog"
      aria-label="Seleziona una data"
      data-testid="mini-calendar-dialog"
    >
      <div class="date-input">
        <input
          type="text"
          class="input-day"
          placeholder="DD"
          maxlength="2"
          inputmode="numeric"
          aria-label="Giorno"
        />
        <span class="slash" aria-hidden="true">/</span>
        <input
          type="text"
          class="input-month"
          placeholder="MM"
          maxlength="2"
          inputmode="numeric"
          aria-label="Mese"
        />
        <span class="slash" aria-hidden="true">/</span>
        <input
          type="text"
          class="input-year"
          placeholder="YYYY"
          maxlength="4"
          inputmode="numeric"
          aria-label="Anno"
        />
      </div>
      <article
        class="mini-calendar-container"
        data-testid="mini-calendar-container"
      ></article>
    </section>

    <!-- -------------------event container-------------------------------------- -->

    <script type="module" src="./src/index.js"></script>
  </body>
</html>
